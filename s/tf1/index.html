<style>
:root{--bg:#0B1220;--surface:#1E293B;--border:#334155;
  --text:#F8FAFC;--muted:#94A3B8;--primary:#818CF8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 60% at 50% -10%,#22345E 0%,#16223F 35%,#0C1426 65%,#0B1220 100%) no-repeat,var(--bg);
  color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.card{max-width:420px;width:100%;text-align:center}
.logo{width:80px;height:80px;border-radius:20px;background:var(--surface);
  display:inline-grid;place-items:center;margin-bottom:24px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
h1 .channel{color:var(--primary)}
.lede{color:var(--muted);margin-bottom:28px}
.btns{display:flex;flex-direction:column;gap:12px}
a.btn{display:block;padding:14px 20px;border-radius:12px;text-decoration:none;
  font-weight:700;background:var(--primary);color:#0B1220}
a.btn:hover{opacity:.9}

/* Badges de magasin. Les chartes d'Apple et de Google imposent la même forme :
   marque en tête, deux lignes de texte, hauteur identique pour les deux, et
   aucune retouche de la marque elle-même. D'où une hauteur fixe et des
   largeurs libres plutôt qu'une grille : c'est la hauteur qui doit
   correspondre, jamais l'encombrement total. */
.stores{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;justify-content:center}
.badge{flex:1 1 45%;min-width:156px;height:56px;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:9px;
  padding:0 12px;border-radius:10px;background:#000;
  border:1px solid rgba(248,250,252,.4);text-decoration:none;color:#fff}
.badge:hover{border-color:rgba(248,250,252,.85)}
.badge .mark{width:26px;height:26px;flex:none}
.badge .label{display:flex;flex-direction:column;justify-content:center;
  line-height:1.15;text-align:left}
.badge .label small{font-size:.62rem;letter-spacing:.01em;white-space:nowrap}
.badge .label strong{font-size:1.1rem;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap}
/* Sur iPhone et iPad, l'App Store passe en tête. */
.stores.apple-first #store-ios{order:-1}
/* Deux badges côte à côte demandent 324 px ; sous 380 px de large, la marge du
   corps est reprise pour les garder sur une rangée plutôt que de les empiler.
   En dessous, ils passent l'un sous l'autre : mieux vaut une colonne que des
   libellés tronqués. */
@media (max-width:380px){body{padding:16px}}
.hint{margin-top:20px;font-size:.85rem;color:var(--muted)}
.more{margin-top:28px;font-size:.85rem;color:var(--muted)}
.more a{color:var(--primary);text-decoration:none}
.more a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg width="48" height="48" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <circle cx="50" cy="50" r="42" stroke="#3B5BA5" stroke-width="3"/>
      <circle cx="50" cy="8"  r="3.6" fill="#60A5FA"/>
      <circle cx="92" cy="50" r="3.6" fill="#60A5FA"/>
      <circle cx="8"  cy="50" r="3.6" fill="#60A5FA"/>
      <circle cx="50" cy="92" r="3.6" fill="#60A5FA"/>
    </svg></div>

  <h1>Rejoins le salon <span class="channel">TF1</span></h1>
  <p class="lede">Azymut, c'est le chat en direct des chaînes de télé françaises. Gratuit, sans pub.</p>

  <div class="btns">
    <div class="stores" id="stores"><a class="badge" id="store-android" href="https://play.google.com/store/apps/details?id=com.yeloda.azymut"
       target="_blank" rel="noopener"
       aria-label="Télécharger Azymut sur Google Play (nouvel onglet)">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="gp-b" x1="105" y1="0" x2="105" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#00E2FF"/><stop offset="1" stop-color="#00A0FF"/>
          </linearGradient>
          <linearGradient id="gp-y" x1="318" y1="256" x2="492" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFE000"/><stop offset="1" stop-color="#FF9C00"/>
          </linearGradient>
          <linearGradient id="gp-r" x1="104" y1="13" x2="386" y2="175" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF3A44"/><stop offset="1" stop-color="#C31162"/>
          </linearGradient>
          <linearGradient id="gp-g" x1="104" y1="499" x2="386" y2="337" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#32A071"/><stop offset="1" stop-color="#00E676"/>
          </linearGradient>
        </defs>
        <path fill="url(#gp-b)" d="M47 0C34 6.8 25.3 19.2 25.3 35.3v441.4c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0z"/>
        <path fill="url(#gp-r)" d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1z"/>
        <path fill="url(#gp-y)" d="m472.2 225.6-88.6-51.3-65.2 65.3 65.2 65.3 90.5-51.3c27.1-21.3 27.1-56.7-1.9-78z"/>
        <path fill="url(#gp-g)" d="M104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
      </svg>
      <span class="label"><small>DISPONIBLE SUR</small><strong>Google Play</strong></span>
    </a>
    <a class="badge" id="store-ios" href="https://apps.apple.com/fr/search?term=azymut"
       target="_blank" rel="noopener"
       aria-label="Télécharger Azymut dans l'App Store (nouvel onglet)">
      <svg class="mark" viewBox="0 0 384 512" aria-hidden="true" focusable="false">
        <path fill="#fff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      <span class="label"><small>Télécharger dans l&rsquo;</small><strong>App Store</strong></span>
    </a></div>
    <a class="btn" id="open-app" href="#">Ouvrir dans l'application</a>
  </div>

  <p class="hint" id="hint">Déjà installée ? Le salon s'ouvre directement.</p>
  <p class="more"><a href="https://yeloda.github.io/Azymut-support/programme/tf1.html">Programme TF1 du jour</a> · <a href="https://yeloda.github.io/Azymut-support/">À propos d'Azymut</a></p>
</div>

<script>
(function () {
  var CHANNEL_ID    = 'tf1';
  var CHANNEL_NAMES = {"tf1":"TF1","france2":"France 2","france3":"France 3","france4":"France 4","france5":"France 5","m6":"M6","arte":"Arte","lcp":"LCP","w9":"W9","tmc":"TMC","tfx":"TFX","gulli":"Gulli","bfmtv":"BFM TV","cnews":"CNews","lci":"LCI","franceinfo":"France Info","cstar":"CStar","t18":"T18","novo19":"NOVO 19","tf1seriesfilms":"TF1 Séries Films","lequipe":"L'Équipe","6ter":"6ter","rmcstory":"RMC Story","rmcdecouverte":"RMC Découverte","cherie25":"Chérie 25","canalplus":"Canal+","eurosport1":"Eurosport 1","eurosport2":"Eurosport 2","rmcsport1":"RMC Sport 1","bein1":"beIN Sports 1","canalplusport":"Canal+ Sport"};
  var SCHEME        = 'azymut';
  var PACKAGE       = 'com.yeloda.azymut';
  var IOS_STORE     = 'https://apps.apple.com/fr/search?term=azymut';
  var ANDROID_STORE = 'https://play.google.com/store/apps/details?id=com.yeloda.azymut';

  // Un identifiant venu de la chaîne de requête est une entrée non maîtrisée :
  // il finit dans une URL et dans le DOM. On ne garde que la forme des slugs
  // réellement utilisés, ce qui exclut d'emblée tout caractère actif.
  function clean(value) {
    return String(value || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);
  }

  var params  = new URLSearchParams(location.search);
  var channel = CHANNEL_ID || clean(params.get('c'));
  var name    = CHANNEL_NAMES[channel] || channel.toUpperCase();

  var nameEl = document.getElementById('channel-name');
  if (nameEl && name) nameEl.textContent = ' ' + name;

  var deepLink = channel ? SCHEME + '://chat/' + channel : SCHEME + '://';

  var ua        = navigator.userAgent || '';
  var isIOS     = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  // Un iPad sous iPadOS 13+ se déclare « Macintosh » ; l'écran tactile le
  // trahit. Sans ce test, un iPad se verrait proposer le lien de bureau.
  var isIPadOS  = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var isAndroid = /Android/.test(ua);
  var isApple   = isIOS || isIPadOS;

  var openBtn  = document.getElementById('open-app');
  var stores   = document.getElementById('stores');
  var hint     = document.getElementById('hint');

  // Les deux badges sont dans la page et y restent : une page de partage est
  // aussi transférée d'un téléphone à l'autre, et masquer le magasin de l'autre
  // système ferait disparaître le lien pour la personne suivante. Seul l'ordre
  // change, pour placer en tête le magasin du visiteur.
  if (isApple && stores) stores.classList.add('apple-first');

  if (isAndroid) {
    // Mécanisme natif de Chrome : si l'application est installée, l'intention
    // l'ouvre sur le salon ; sinon Chrome suit lui-même l'URL de repli. Aucun
    // minuteur, aucune détection approximative, et jamais de page d'erreur.
    openBtn.href =
      'intent://chat/' + channel + '#Intent;scheme=' + SCHEME +
      ';package=' + PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(ANDROID_STORE) +
      ';end';
  } else if (isApple) {
    openBtn.href = deepLink;

    // iOS n'offre pas d'équivalent à l'intention Android. On tente le schéma,
    // et on part vers le magasin si rien ne s'est passé.
    //
    // La tentative est déclenchée par un APPUI, jamais au chargement : quand
    // l'application est absente, Safari affiche « adresse non valide ». Le
    // faire spontanément infligerait cette alerte à la majorité des visiteurs
    // — ceux qui n'ont pas encore l'application, c'est-à-dire précisément le
    // public d'un lien de partage. Après un appui volontaire, c'est un
    // comportement attendu ; et une fois les liens universels en place, les
    // personnes équipées ne voient plus cette page du tout.
    openBtn.addEventListener('click', function (event) {
      event.preventDefault();

      var left = false;
      var noteDeparture = function () { left = true; };

      // Si l'application s'ouvre, la page passe en arrière-plan : c'est le
      // seul signal fiable de succès, et il évite d'enchaîner sur le magasin
      // alors que l'application vient de démarrer.
      document.addEventListener('visibilitychange', noteDeparture);
      window.addEventListener('pagehide', noteDeparture);

      setTimeout(function () {
        document.removeEventListener('visibilitychange', noteDeparture);
        window.removeEventListener('pagehide', noteDeparture);
        if (!left && !document.hidden) location.href = IOS_STORE;
      }, 1500);

      location.href = deepLink;
    });
  } else {
    // Ordinateur : le lien profond reste posé — un navigateur sans gestionnaire
    // pour le schéma ne fera rien, mais le bouton doit exister partout, sans
    // quoi la page n'offre plus aucune issue à qui a déjà l'application. Le
    // repère de bas de page dit pourquoi il peut rester sans effet ici.
    openBtn.href = deepLink;
    if (hint) hint.textContent = 'Azymut est une application mobile : ouvre ce lien depuis ton téléphone pour rejoindre le salon.';
  }
})();
</script>
</body>
</html>
